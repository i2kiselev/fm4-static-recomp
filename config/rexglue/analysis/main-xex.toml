# Manual main-XEX analysis facts for default.xex, at their addresses in the 1.0 code image
# (SHA-256 6A7E9AE561CCCA134916F27870A73299408F4AD14F1499063C0F6F6414C2A7E1 for 1.0 PAL,
# 3618E85AF83E972DDCC1B0D0DD808E78E29AB4AB3890A15B31C210A6A3E93E09 for 1.0 USA: the same image).
# tools/release_analysis.py moves them into the image being built through
# config/rexglue/releases/<image>.toml; each image's [functions] are in fragments-<image>.toml.

# Microsoft CRT non-local jump pair (9 setjmp and 8 longjmp call sites). These
# must be semantic codegen hooks so a longjmp restores the host-side PPCContext
# captured at the setjmp call site.
setjmp_address = 0x82762EC0
longjmp_address = 0x82762A90

# The title's statically linked XAPI fiber functions, served by the SDK's host
# fibers (kernel/crt/threading.cpp). SwitchToFiber is a thunk into the
# context-switch routine at 0x82C7A460, which has no PDATA and cannot be
# translated as an ordinary function.
[rexcrt]
ConvertThreadToFiber = 0x82C77AD8
ConvertFiberToThread = 0x82C77B68
CreateFiber = 0x82C77BB8
DeleteFiber = 0x82C77C98
SwitchToFiber = 0x82C77CF8

# sub_825CAAF0 bounds its switch index in r3 (cmplwi r3, 9) and indexes the
# byte table at 0x82043888 with the copy in r28, so the scanner read past the
# ten real entries into the following functions.
[[switch_tables]]
address = 0x825CAB50
register = 28
labels = [
    0x825CAB54, 0x825CAB78, 0x825CABA0, 0x825CABAC, 0x825CABB8,
    0x825CABC4, 0x825CABD0, 0x825CAB60, 0x825CAC20, 0x825CAB6C,
]

# The boot sequence, after the developer options are parsed into the options
# object (r23, 0x82DC4420): its byte 0xB5C (disablesplashintro) skips the
# disclaimer screen and the T10/Microsoft and Dolby videos.
[[midasm_hook]]
address = 0x826D1438
name = "Fm4SplashIntroOption"
registers = ["r23"]

# The renderer's depth of field switch (renderer, enable): the showroom passes
# the enablehomespacedof option, scene changes pass 0 or 1.
[[midasm_hook]]
address = 0x824360D8
name = "Fm4DepthOfFieldOption"
registers = ["r4"]

# The render thread's present interval setter (thread, interval): 1 in races, 2
# in the showroom, pre-race and other scenes the game draws at half the frame
# rate. Besides the swap's vblank interval, 2 makes the render thread draw only
# every second frame it is handed (822DB780: frame counter 0x930 & 1).
[[midasm_hook]]
address = 0x82436078
name = "Fm4PresentInterval"
registers = ["r4"]

# Autovista's walkaround camera update (WalkaroundCamera.ini), once per main loop
# tick while Autovista is open: its opening is an input event for recordings.
[[midasm_hook]]
address = 0x824C7308
name = "Fm4AutovistaCameraUpdate"

# The car shadow map's setup (renderer, variance map size, grey map size): 512
# and 256 or 512 from every caller (256 and 256 with UseSmallShadowMap). Above
# 512 and 256 it allocates the textures outside the renderer's shared memory.
[[midasm_hook]]
address = 0x828D4398
name = "Fm4ShadowMapSetup"
registers = ["r4", "r5"]

# The setup compares the variance size with 512 (cmplwi r30, 0x200). Above it the
# game allocates a texture object of its own, but the car shaders' stage 13 binds
# the renderer's header at +0x1B24 (0x8236849C), which only the path for 512 and
# below fills: a larger map takes that path (r8 = 0 is its pool argument).
[[midasm_hook]]
address = 0x828D4510
name = "Fm4ShadowMapKeepHeader"
registers = ["r30", "r8"]
jump_address_on_true = 0x828D4544

# That path points the header at the shared memory (r4) and places the grey map
# right after the variance map's r26 bytes: a larger variance map goes to a
# buffer of its own instead, and the grey map to the start of the shared memory.
[[midasm_hook]]
address = 0x828D45B0
name = "Fm4ShadowMapMemory"
registers = ["r4", "r26"]

# The shadow pass's own setup (variance map size, ...), called after each of the above.
[[midasm_hook]]
address = 0x82945230
name = "Fm4ShadowPassSetup"
registers = ["r3", "r4", "r6"]

# The shadow pass creates its EDRAM surfaces (entry r31: +0xD0 width, +0xD4 height,
# +0xD8 4 for the variance map, asking for 4x MSAA) with the MSAA in r30, or none
# when w * h * samples * 8 bytes exceed the 10 MB of EDRAM.
[[midasm_hook]]
address = 0x82955764
name = "Fm4ShadowPassMsaa"
registers = ["r30", "r31"]

# The car reflection cube's setup (renderer, face size, ...): 256 from every
# caller (the presentation defaults at 0x82D8C080 + 0x24). A cube larger than
# the shared memory's 1.5 MB gets an allocation of its own.
[[midasm_hook]]
address = 0x828D15B0
name = "Fm4ReflectionCubeSetup"
registers = ["r4"]

# The cube's memory (r3) is about to be stored: the shared memory, or an
# allocation of its own (also at renderer r31 + 0x13C0). r26 is the face size,
# r30 the cube's bytes.
[[midasm_hook]]
address = 0x828D1718
name = "Fm4ReflectionCubeMemory"
registers = ["r3", "r26", "r30", "r31"]

# The render scenario loader (once, at renderer init) has read one
# RenderScenarios\*.xml into its settings object r31; the file's name is the
# string at r1 + 96. SHOWROOM MSAA and RACE MSAA rewrite the files' tiling.
[[midasm_hook]]
address = 0x828E8194
name = "Fm4ScenarioFileLoaded"
registers = ["r1", "r31"]

# The game side's scenario push (this, ref to settings object): it pushes the
# file, then applies the file's UI tiling to the device, while the renderer
# reads TilingScenario every frame. A file's tiling therefore changes only here,
# before its push; a change inside a running scene draws it in stripes.
[[midasm_hook]]
address = 0x82450DE0
name = "Fm4ScenarioPush"
registers = ["r4"]

# CCarThumbnailRenderStateMachine (vtable 0x8200DA0C, state table 0x8200D9C8)
# renders a car's garage thumbnail in states 1 to 3 (load the uithumbnail
# backdrop, draw, read back and save), twice per new car or paint: uithumbig,
# then uithumbnail. Its state 1 entry starts a render...
[[midasm_hook]]
address = 0x823C6A18
name = "Fm4ThumbnailRenderStart"

# ...and its state 3 update, once the readback is done, sets state 0 here.
[[midasm_hook]]
address = 0x823C6BA0
name = "Fm4ThumbnailRenderDone"

# Its state 2 update goes on to the final render once the studio track is ready
# (bytes 48-50) and the car is: r3 holds the car's check here, and 0 keeps the
# state 2 update running a few more ticks, until the car's lighting has caught up.
[[midasm_hook]]
address = 0x823C6AF4
name = "Fm4ThumbnailSettle"
registers = ["r3"]

# The main loop ticks once per guest vblank (every second one in menus). The
# loop has just loaded its race session pointer (lwz r11, 4(r31)), null in the
# showroom and non-null on the pre-race screen...
[[midasm_hook]]
address = 0x822F7C30
name = "Fm4MainLoopSession"
registers = ["r11"]

# ...and this function, the tail of the game's vblank callback, counts vblanks
# and wakes the loop for its next tick (every second one in menus): outside a
# race the hook lets it run only fm4_menu_vblank_hz times a second.
[[midasm_hook]]
address = 0x826CB760
name = "Fm4SkipVblankCallback"
return_on_true = true

# The main loop stores its time step here (stfs f31, 0x198(r31)): r30 is the
# measured milliseconds, f31 the step, which is 1/59.94 s when r30 is 16 or 17.
# The showroom camera's step below, and diagnostics for fm4_physics_log.
[[midasm_hook]]
address = 0x822F7D48
name = "Fm4MainLoopStep"
registers = ["r30", "f31"]

# A car's update splits that step into ceil(step * CarPhysicsUpdateHz) substeps
# (PhysicsSettings.ini, 359; 239 when r28 is set): r31 is the count, r30 the car.
[[midasm_hook]]
address = 0x82822D28
name = "Fm4PhysicsLogCar"
registers = ["r30", "r31", "r28", "f31"]

# The same for cars with word 0x954 and byte 0x41E4 set, which take a shorter update.
[[midasm_hook]]
address = 0x828223C4
name = "Fm4PhysicsLogOtherCar"
registers = ["r30", "r11", "f31"]

# GRAPHICS in My Profile -> Options (src/ui/graphics_page.cpp). The menu builder
# has added the last Options item and released its temporaries: the hook adds
# GRAPHICS (action 23) after it with guest calls, as the game adds each item.
[[midasm_hook]]
address = 0x8256CCF4
name = "Fm4AddGraphicsOption"
context = true
registers = ["r1", "r30", "r31"]

# The string table lookup (table, key) answers the entry's key itself, and
# rewrites the strings that name pad buttons while the keyboard is in use.
[[midasm_hook]]
address = 0x823A4780
name = "Fm4GraphicsOptionText"
context = true
registers = ["r1", "r3", "r4"]
return_on_true = true

# The Options dispatcher (this, action): action 23 opens the host page. The
# game ignores actions it has no scene for, so nothing else changes.
[[midasm_hook]]
address = 0x82589460
name = "Fm4OpenGraphicsOption"
registers = ["r4"]
return_on_true = true

# The showroom's update has just loaded 1/60 s as its camera queue's step
# (lfs f1 before the virtual call through camera +0xC), whatever the tick
# length, so the camera ran 2x real time at 120 ticks a second (measured
# against the cut times in Media/Camera/HomeSpaceCams.xml). The hook passes
# the main loop's measured time since the last update instead.
[[midasm_hook]]
address = 0x824B9D84
name = "Fm4ShowroomCameraStep"
registers = ["f1"]

# The in-game UI's loading screen opens (this+0x2c, the "LoadingScreen" scene of
# UIInGame/UI): once per race load, right after GO RACE. A race load advances
# partly once per main loop tick, so the hook runs the guest vblank at 480 Hz
# until the cars step again, or the menus' UI does after a quit (src/game_hooks.cpp).
[[midasm_hook]]
address = 0x823B68B8
name = "Fm4LoadingScreen"

# The UI scene update has just loaded a fixed 1/60 s per tick into f31 (its
# only use is the step passed on below); it runs in every menu and the showroom,
# not in a race, so menus animated 2x the console's speed at 120 ticks a second.
# The hook passes the measured time instead, and ends a fast load that leads to a menu.
[[midasm_hook]]
address = 0x822A46D0
name = "Fm4UiSceneStep"
registers = ["f31"]

# The race's menu scenes (pause, pre-race, post-race, replay) are created by their
# constructors and destroyed by their deleting destructors (vtable slot 1); while
# one lives over a race the keys follow the menu bindings (src/input/input_context.*).
[[midasm_hook]]
address = 0x8259A1A8
name = "Fm4RaceMenuSceneCreated"
registers = ["r3"]

[[midasm_hook]]
address = 0x825BF750
name = "Fm4RaceMenuSceneCreated"
registers = ["r3"]

[[midasm_hook]]
address = 0x825C10B0
name = "Fm4RaceMenuSceneCreated"
registers = ["r3"]

[[midasm_hook]]
address = 0x825BFA28
name = "Fm4RaceMenuSceneCreated"
registers = ["r3"]

[[midasm_hook]]
address = 0x8259BE00
name = "Fm4RaceMenuSceneDestroyed"
registers = ["r3"]

[[midasm_hook]]
address = 0x825BF7E0
name = "Fm4RaceMenuSceneDestroyed"
registers = ["r3"]

[[midasm_hook]]
address = 0x825BF700
name = "Fm4RaceMenuSceneDestroyed"
registers = ["r3"]

[[midasm_hook]]
address = 0x825BFAC0
name = "Fm4RaceMenuSceneDestroyed"
registers = ["r3"]
